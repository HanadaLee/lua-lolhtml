name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'HanadaLee/lua-lolhtml'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check out Telescope
        uses: actions/checkout@v6
        with:
          repository: jdesgats/telescope
          path: .ci/telescope
          persist-credentials: false

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libluajit-5.1-dev luajit
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build and test the LuaJIT binding
        run: bash util/run-tests.sh
